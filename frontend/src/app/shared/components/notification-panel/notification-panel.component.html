<div class="np-host">
  <button
    type="button"
    class="np-trigger"
    [class.np-has-unread]="notificationService.unreadCount() > 0"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
    [title]="notificationService.unreadCount() > 0
      ? ('components.notifications.unreadCount' | translate:{ count: notificationService.unreadCount() })
      : ('components.notifications.title' | translate)"
    [attr.aria-label]="'components.notifications.title' | translate"
  >
    <i class="bi bi-bell" aria-hidden="true"></i>
    @if (notificationService.unreadCount() > 0) {
      <span class="np-badge" [attr.aria-label]="'components.notifications.unread' | translate:{ count: notificationService.unreadCount() }">
        {{ notificationService.unreadCount() > 99 ? '99+' : notificationService.unreadCount() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <div class="np-panel" role="menu">
      <div class="np-panel-header">
        <span class="np-panel-title">{{ 'components.notifications.title' | translate }}</span>
        @if (notificationService.unreadCount() > 0) {
          <button type="button" class="np-mark-all" (click)="markAllRead($event)">{{ 'components.notifications.markAllRead' | translate }}</button>
        }
      </div>

      <div class="np-list">
        @for (n of notificationService.notifications().slice(0, 8); track n.id) {
          <button type="button" class="np-item" [class.np-item-unread]="!n.isRead" (click)="open(n)">
            <span class="np-item-icon" [style.background]="bgColor(n)" [style.color]="color(n)">
              <i class="bi" [class]="icon(n)" aria-hidden="true"></i>
            </span>
            <span class="np-item-body">
              <span class="np-item-message">{{ n | notificationText }}</span>
              <span class="np-item-time">{{ relativeTime(n) }}</span>
            </span>
            @if (!n.isRead) {
              <span class="np-item-dot" aria-hidden="true"></span>
            }
          </button>
        } @empty {
          <div class="np-empty">
            <i class="bi bi-bell-slash" aria-hidden="true"></i>
            <span>{{ 'components.notifications.allCaughtUp' | translate }}</span>
          </div>
        }
      </div>

      <button type="button" class="np-view-all" (click)="viewAll()">{{ 'components.notifications.viewAll' | translate }}</button>
    </div>
  }
</div>
