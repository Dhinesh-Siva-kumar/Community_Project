@if (open) {
  <div
    class="dpm-backdrop"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:transparent;z-index:1200;"
    appScrollLock
    (click)="onBackdropClick()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dpmTitle"
  >
    <div class="dpm-modal" (click)="$event.stopPropagation()">
      <div class="dpm-header">
        <div class="dpm-icon-wrap">
          <i class="bi bi-trash3-fill"></i>
        </div>
        <div class="dpm-header-text">
          <h5 class="dpm-title" id="dpmTitle">{{ 'components.postDelete.title' | translate }}</h5>
          <p class="dpm-subtitle">{{ 'components.deleteModal.cannotBeUndone' | translate }}</p>
        </div>
        <button type="button" class="dpm-close" (click)="onCancel()" [disabled]="deleting" [attr.aria-label]="'components.postDelete.closeDialog' | translate">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="dpm-body">
        <p class="dpm-message">{{ 'components.postDelete.confirm' | translate }}</p>
        @if (previewContent) {
          <div class="dpm-post-preview">
            <p class="mb-0 small">{{ previewContent }}</p>
          </div>
        }
        <div class="dpm-warning-box">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ 'components.postDelete.warning' | translate }}</span>
        </div>
      </div>

      <div class="dpm-footer">
        <button type="button" class="dpm-btn dpm-btn--cancel" (click)="onCancel()" [disabled]="deleting">
          {{ 'common.cancel' | translate }}
        </button>
        <button type="button" class="dpm-btn dpm-btn--delete" (click)="onConfirm()" [disabled]="deleting">
          @if (deleting) {
            <span class="spinner-border spinner-border-sm me-2"></span>{{ 'common.deleting' | translate }}
          } @else {
            <i class="bi bi-trash3-fill me-2"></i>{{ 'components.postDelete.title' | translate }}
          }
        </button>
      </div>
    </div>
  </div>
}
