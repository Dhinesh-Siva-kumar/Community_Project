<div class="toast-container" [attr.aria-label]="'components.notifications.title' | translate">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast-item"
      [class]="getBgClass(toast.type)"
      [attr.role]="toast.type === 'error' || toast.type === 'warning' ? 'alert' : 'status'"
      [attr.aria-live]="toast.type === 'error' || toast.type === 'warning' ? 'assertive' : 'polite'"
      aria-atomic="true"
    >
      <div class="toast-body">
        <i class="bi" [class]="getIcon(toast.type)"></i>
        <span class="toast-message">{{ toast.message }}</span>
      </div>
      <button
        type="button"
        class="toast-close"
        (click)="dismiss(toast.id)"
        [attr.aria-label]="'common.close' | translate"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  }
</div>
