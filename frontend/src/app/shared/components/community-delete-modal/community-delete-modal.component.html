@if (open && community) {
  <div class="au-backdrop" (click)="requestClose()"></div>
  <div class="au-modal cm-delete-modal" role="alertdialog" aria-modal="true" aria-labelledby="deleteCommunityModalTitle" (click)="$event.stopPropagation()">

    <div class="au-header cm-delete-modal-header">
      <div class="au-header__cover-shapes" aria-hidden="true">
        <span class="shape shape--1"></span>
        <span class="shape shape--2"></span>
      </div>
      <div class="au-header__icon cm-delete-modal-icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <div class="au-header__text cm-modal-header-inner">
        <h5 class="au-header__title cm-modal-title" id="deleteCommunityModalTitle">{{ 'components.communityDelete.title' | translate }}</h5>
        <p class="au-header__sub cm-modal-subtitle">{{ 'components.deleteModal.cannotBeUndone' | translate }}</p>
      </div>
      <button type="button" class="au-close cm-close-btn" (click)="requestClose()" [disabled]="deleting()" [attr.aria-label]="'common.close' | translate">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="au-body cm-delete-modal-body">
      <p class="cm-delete-modal-text">
        {{ 'components.communityDelete.confirmPre' | translate }} <strong>"{{ community.name }}"</strong>{{ 'components.communityDelete.confirmPost' | translate }}
      </p>
    </div>

    <div class="au-footer cm-modal-footer">
      <button type="button" class="au-btn cm-btn-cancel au-btn--ghost"
        (click)="requestClose()" [disabled]="deleting()">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button" class="au-btn cm-btn-submit au-btn--danger"
        (click)="confirmDelete()" [disabled]="deleting()">
        @if (deleting()) {
          <span class="spinner-border spinner-border-sm"></span>
          {{ 'common.deleting' | translate }}
        } @else {
          <i class="bi bi-trash3-fill"></i>
          {{ 'components.communityDelete.title' | translate }}
        }
      </button>
    </div>

  </div>
}
