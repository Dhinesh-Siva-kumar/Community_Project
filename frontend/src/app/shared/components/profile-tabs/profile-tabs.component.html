<nav
  class="profile-tabs"
  [class.profile-tabs--full]="fullWidth"
  [style.--tab-count]="tabCountVar"
  [style.--active-index]="activeIndexVar"
  role="tablist"
  [attr.aria-label]="'components.profileTabs.sections' | translate"
>
  @if (fullWidth && tabs.length > 0) {
    <!-- Width and slide distance are derived from --tab-count / --active-index
         in the stylesheet, so they stay correct for any tab count and any
         label length. -->
    <span class="tab-indicator" [style.background]="activeTabBg" aria-hidden="true"></span>
  }
  @for (tab of tabs; track tab.id) {
    <button
      #tabBtn
      role="tab"
      class="profile-tab"
      [class.active]="tab.id === activeTab"
      [disabled]="tab.disabled"
      [attr.aria-selected]="tab.id === activeTab"
      [attr.aria-disabled]="tab.disabled || null"
      [style.--tab-color]="tab.color"
      (click)="select(tab)"
    >
      @if (tab.icon) {
        <span class="tab-icon-chip"><i [class]="'bi ' + tab.icon"></i></span>
      }
      <!-- title carries the full text for the equal-width variant, where a
           long label (Tamil runs noticeably longer than English) is ellipsised
           rather than allowed to widen the row. -->
      <span class="tab-label" [title]="tab.label | translate">{{ tab.label | translate }}</span>
      @if (tab.badge) {
        <span class="tab-badge">{{ tab.badge }}</span>
      }
    </button>
  }
</nav>
