<nav class="profile-tabs" [class.profile-tabs--full]="fullWidth" role="tablist" aria-label="Profile sections">
  @if (fullWidth && tabs.length > 0) {
    <span
      class="tab-indicator"
      [style.transform]="'translateX(calc(' + activeIndex + ' * 100%))'"
      [style.background]="activeTabBg"
      aria-hidden="true"
    ></span>
  }
  @for (tab of tabs; track tab.id) {
    <button
      #tabBtn
      role="tab"
      class="profile-tab"
      [class.active]="tab.id === activeTab"
      [disabled]="tab.disabled"
      [attr.aria-selected]="tab.id === activeTab"
      [attr.aria-disabled]="tab.disabled || null"
      [style.--tab-color]="tab.color"
      (click)="select(tab)"
    >
      @if (tab.icon) {
        <span class="tab-icon-chip"><i [class]="'bi ' + tab.icon"></i></span>
      }
      <span class="tab-label">{{ tab.label }}</span>
      @if (tab.badge) {
        <span class="tab-badge">{{ tab.badge }}</span>
      }
    </button>
  }
</nav>
